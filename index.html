<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23FDFBF5'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-size='18' font-weight='bold' fill='%237A5944'>C</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORPEAS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind CSS Configuration
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beige: {
              50:  '#FDFBF5', // Very light beige, almost white
              100: '#FBF5EB', // Light beige
              200: '#F5EADC', // Beige
              300: '#EFE0CE', // Darker beige
            },
            brown: {
              100: '#F0E6DB',
              200: '#E1CEBE',
              300: '#D1B6A2',
              400: '#C29E85',
              500: '#A37B5F', // Main Brown
              600: '#8F6A51', // Darker Brown
              700: '#7A5944', // Even Darker Brown
              800: '#654837',
              900: '#50382A', // Very Dark Brown
            }
          },
          animation: {
             'nexus-pulse': 'nexus-pulse 8s infinite ease-in-out', // For Nexus Graphic
             'nexus-core-pulse': 'nexus-core-pulse 5s infinite ease-in-out', // For Nexus Graphic Core
             'nexus-rotate': 'nexus-rotate 25s infinite linear', // For Nexus Graphic Rotation
             'nexus-drift': 'nexus-drift 10s infinite ease-in-out', // For Nexus Particles
             'fadeIn': 'fadeIn 0.5s ease-out forwards', // General fadeIn
             'fadeInUpSlight': 'fadeInUpSlight 0.5s ease-out forwards', // For subtle fadeInUp
          },
          keyframes: { // Define keyframes for animations
            'nexus-pulse': {
              '0%, 100%': { opacity: '0.3', transform: 'scale(0.95)' },
              '50%': { opacity: '0.7', transform: 'scale(1.05)' },
            },
            'nexus-core-pulse': {
              '0%, 100%': { opacity: '0.8', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.03)' },
            },
            'nexus-rotate': {
              from: { transform: 'rotate(0deg)' },
              to: { transform: 'rotate(360deg)' },
            },
            'nexus-drift': {
                '0%, 100%': { transform: 'translate(0,0) scale(1)', opacity: '0.1' },
                '25%': { transform: 'translate(10px, -15px) scale(0.8)', opacity: '0.3' },
                '50%': { transform: 'translate(-5px, 10px) scale(1.1)', opacity: '0.5' },
                '75%': { transform: 'translate(5px, 5px) scale(0.9)', opacity: '0.2' },
            },
            fadeIn: { 
              from: { opacity: '0' },
              to: { opacity: '1' },
            },
            fadeInUpSlight: { // Keyframes for fadeInUpSlight
              from: { opacity: '0', transform: 'translateY(10px)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            },
          }
        }
      }
    };
  </script>
  <style>
    /* Blinking animation for Coming Soon text */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-blink {
      animation: blink 1.5s infinite;
    }

    body {
        color: #654837; /* brown-800 */
        background-color: #FBF5EB; /* beige-100 */
    }

    /* Utility to hide scrollbars */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Global Animations */
    .animate-fadeIn {
        animation: fadeIn 0.5s ease-out forwards;
    }
    
    @keyframes fadeInSlideDown { /* For mobile accordion content */
      from { opacity: 0; transform: translateY(-10px); }
      to: { opacity: 1; transform: translateY(0); }
    }
     .animate-fadeInSlideDown {
      animation: fadeInSlideDown 0.4s ease-out forwards;
    }

    /* Animation for smooth height transition (e.g., accordions) */
    @keyframes growDown {
      from {
        opacity: 0;
        max-height: 0;
      }
      to {
        opacity: 1;
        max-height: 500px; /* Adjust as needed, should be larger than content */
      }
    }
    .accordion-content-grow {
      animation: growDown 0.5s ease-in-out forwards;
      overflow: hidden;
    }
    @keyframes shrinkUp {
      from {
        opacity: 1;
        max-height: 500px;
      }
      to {
        opacity: 0;
        max-height: 0;
      }
    }
    .accordion-content-shrink {
      animation: shrinkUp 0.3s ease-in-out forwards;
      overflow: hidden;
    }

    /* Styles for CircularImageWheel - ensures they are globally available */
    .wheel-segment {
      cursor: pointer;
    }

  </style>
