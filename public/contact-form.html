<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Contact Form</title>
  <style>
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      background-color: #10B981; /* Green color */
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transform: translateX(120%);
      transition: transform 0.3s ease-in-out;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      transform: translateX(0);
    }
    .toast svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body class="bg-[#fdfaf4] text-[#4b2e2e] font-sans p-6">
  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span>Message sent successfully!</span>
  </div>

  <form id="contactForm" class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-8 space-y-6" action="https://formsubmit.co/business@corpeas.com" method="POST">
    
    <!-- Hidden Inputs for FormSubmit -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="New message from website!">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" style="display:none">

    <!-- Full Name -->
    <label for="name" class="block text-sm font-semibold mb-1">Full Name</label>
    <div class="relative mb-5">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#a07c5c]">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
        </svg>
      </span>
      <input type="text" id="name" name="name" placeholder="John Doe"
        class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 bg-[#f8f5f0] text-sm focus:outline-none focus:ring-2 focus:ring-[#6b4226]" required />
    </div>

    <!-- Email -->
    <label for="email" class="block text-sm font-semibold mb-1">Email</label>
    <div class="relative mb-5">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#a07c5c]">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
        </svg>
      </span>
      <input type="email" id="email" name="email" placeholder="you@example.com"
        class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 bg-[#f8f5f0] text-sm focus:outline-none focus:ring-2 focus:ring-[#6b4226]" required />
    </div>

    <!-- Message -->
    <label for="message" class="block text-sm font-semibold mb-1">Message</label>
    <div class="relative mb-5">
      <span class="absolute left-3 top-3 text-[#a07c5c]">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zm-4 0H9v2h2V9z" clip-rule="evenodd" />
        </svg>
      </span>
      <textarea id="message" name="message" rows="4" placeholder="Your message..."
        class="w-full pl-10 pr-4 pt-2 pb-2 rounded-lg border border-gray-300 bg-[#f8f5f0] text-sm focus:outline-none focus:ring-2 focus:ring-[#6b4226]" required></textarea>
    </div>

    <!-- Submit -->
    <button type="submit"
      class="w-full bg-[#6b4226] hover:bg-[#5a371f] text-white font-semibold py-2.5 rounded-lg transition-all duration-200">
      Send Message
    </button>
  </form>
  
  <script>
    document.getElementById('contactForm').addEventListener('submit', function() {
      // Show toast when form is submitted
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      
      // Hide toast after 3 seconds
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
      
      // Let the form submit normally
      return true;
    });
  </script>
</body>
</html>
